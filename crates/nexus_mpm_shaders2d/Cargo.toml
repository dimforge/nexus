[package]
name = "nexus_mpm_shaders2d"
authors = { workspace = true }
description = "2D GPU shaders for nexus physics engine (rust-gpu)."
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
exclude = { workspace = true }
links = "nexus_mpm_shaders2d"
build = "build.rs"


[lib]
path = "../../src_mpm_shaders/lib.rs"

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim3"))',
    'cfg(target_arch, values("spirv", "nvptx64"))',
    'cfg(target_arch_is_gpu)',
] }

[features]
default = ["dim2"]
dim2 = []
unsafe_remove_boundchecks = ["vortx-shaders/unsafe_remove_boundchecks"]
push_constants = []
# Enables some changes in the shaders for compatibility with web platforms.
web-compat = ["nexus_rbd_shaders2d/web-compat"]
cpu = []
cpu-parallel = ["cpu", "vortx-shaders/cpu-parallel"]
cuda = []
# cuda-oxide compiler for the CUDA kernels (implies `cuda`).
cuda-oxide = ["cuda", "khal-std/cuda-oxide", "vortx-shaders/cuda-oxide", "nexus_rbd_shaders2d/cuda-oxide"]

[dependencies]
nexus_rbd_shaders2d = { workspace = true }
vortx-shaders = { workspace = true }
khal-std = { workspace = true }
unroll = { workspace = true }
crunchy = { workspace = true }
glamx = { workspace = true }
parry2d = { workspace = true, features = ["dim2","f32"] }

[build-dependencies]
khal-std = { workspace = true }

# Host-only dependencies (excluded on GPU targets: spirv, nvptx64).
[target.'cfg(not(any(target_arch = "spirv", target_arch = "nvptx64")))'.dependencies]
bytemuck = { workspace = true }
khal = { workspace = true }

[package.metadata.rust-gpu.build]
capabilities = ["GroupNonUniform", "GroupNonUniformArithmetic", "GroupNonUniformShuffle"]
