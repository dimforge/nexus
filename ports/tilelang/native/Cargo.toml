[package]
name = "nexus-tilelang-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["metal"]
metal = ["khal/metal", "khal/webgpu", "dep:metal"]
rust-reference = ["metal", "dep:nexus_rbd3d", "nexus_rbd3d/metal", "dep:vortx", "dep:futures"]
scene-upload = ["dep:nexus_rbd3d", "nexus_rbd3d/cpu", "dep:futures"]

runtime = ["scene-upload", "dep:sha2"]

[dependencies]
khal = { version = "0.4", default-features = false, features = ["derive"] }
metal = { version = "0.33", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
sha2 = { version = "0.10.9", optional = true }
nexus_rbd3d = { path = "../../../crates/nexus_rbd3d", default-features = false, features = ["dim3", "f32"], optional = true }
vortx = { version = "0.5", optional = true }
futures = { version = "0.3", optional = true }

[[bin]]
name = "rust-reference"
required-features = ["rust-reference"]

[patch.crates-io]
khal = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
khal-derive = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
khal-std = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
khal-builder = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
vortx = { git = "https://github.com/dimforge/vortx", tag = "v0.5.0" }
vortx-shaders = { git = "https://github.com/dimforge/vortx", tag = "v0.5.0" }

[[bin]]
name = "native-replay"
required-features = ["metal"]

[[bin]]
name = "native-frame"
required-features = ["metal"]

[[bin]]
name = "runtime-upload"
required-features = ["scene-upload"]

[[bin]]
name = "runtime-reference"
required-features = ["scene-upload"]
