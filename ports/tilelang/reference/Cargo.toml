[package]
name = "nexus-tilelang-reference"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "nexus-tilelang-reference"

# Isolated host-only oracle: no cargo-gpu, Python or accelerator is needed.
[workspace]

[dependencies]
nexus_rbd_shaders3d = { path = "../../../crates/nexus_rbd_shaders3d", default-features = false, features = ["dim3", "cpu"] }
khal = { version = "0.4", default-features = false, features = ["cpu", "derive"] }
khal-std = { version = "0.4", features = ["cpu"] }
bytemuck = "1"
serde_json = "1"

[patch.crates-io]
khal = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
khal-derive = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
khal-std = { git = "https://github.com/dimforge/khal", tag = "v0.4.0" }
vortx-shaders = { git = "https://github.com/dimforge/vortx", tag = "v0.5.0" }

[[bin]]
name = "operations"
path = "src/operations.rs"

[[bin]]
name = "primitives"
path = "src/primitives.rs"

[[bin]]
name = "bodies"
path = "src/bodies.rs"

[[bin]]
name = "poses"
path = "src/poses.rs"

[[bin]]
name = "contacts"
path = "src/contacts.rs"

[[bin]]
name = "links"
path = "src/links.rs"

[[bin]]
name = "warmstarts"
path = "src/warmstarts.rs"

[[bin]]
name = "cpu-dispatch-check"
path = "src/cpu_dispatch_check.rs"

[[bin]]
name = "hubs"
path = "src/hubs.rs"

[[bin]]
name = "scans"
path = "src/scans.rs"
