name: TileLang parity pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity:
    name: Rust reference / TileLang CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-cache
      TVM_FFI_CACHE_DIR: ${{ runner.temp }}/tvm-ffi-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ports/tilelang/reference/target
          key: tilelang-reference-${{ runner.os }}-${{ hashFiles('ports/tilelang/reference/Cargo.lock', 'ports/tilelang/reference/rust-toolchain.toml') }}
      - name: Check Rust exporter
        run: |
          cargo fmt --manifest-path ports/tilelang/reference/Cargo.toml -- --check
          cargo clippy --locked --manifest-path ports/tilelang/reference/Cargo.toml --all-targets -- -D warnings
      - name: Test change tracking without an accelerator
        run: |
          python -m unittest discover -s ports/tilelang/tests -p test_parity.py -v
          python -m unittest discover -s ports/tilelang/tests -p test_inventory.py -v
          python ports/tilelang/inventory.py
      - name: Install pinned compiler with CPU-only PyTorch
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ports/tilelang/requirements.txt
      - name: Replay the current Rust reference
        run: python ports/tilelang/replay.py --operation all --target c
      - name: Test replay corruption and race detection
        run: python -m unittest discover -s ports/tilelang/tests -p test_replay.py -v
      - name: Require reconciled source and fresh CPU execution evidence
        run: >-
          python ports/tilelang/parity.py check --require c
          --evidence ports/tilelang/results/c/report.json
          --evidence ports/tilelang/results/effective_mass/c/report.json
          --evidence ports/tilelang/results/warmstart/c/report.json
          --evidence ports/tilelang/results/integrate/c/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tilelang-cpu-parity
          path: ports/tilelang/results/
          if-no-files-found: ignore
